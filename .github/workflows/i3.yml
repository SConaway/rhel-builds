name: Build i3

on:
  push:
    branches: ['**']
    paths:
      - 'packages/i3/**'
      - 'build.sh'
      - '.github/workflows/i3.yml'
    tags:
      - 'i3-v*'
  pull_request:
    paths:
      - 'packages/i3/**'
      - 'build.sh'
      - '.github/workflows/i3.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rhel_version: [rhel8]  # add rhel9 if rhel8 build doesn't run on RHEL9

    steps:
      - uses: actions/checkout@v7

      - name: Build ${{ matrix.rhel_version }}
        run: ./build.sh i3 ${{ matrix.rhel_version }}

      - name: Test on AlmaLinux 8
        run: ./test.sh i3 rhel8

      - name: Test on AlmaLinux 9 (rhel8 binary, glibc forwards-compat)
        run: ./test.sh i3 rhel9

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: i3-${{ matrix.rhel_version }}
          path: output/i3/${{ matrix.rhel_version }}/
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/i3-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: false

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./scripts/release.sh i3
          'Binary builds of [i3 v{version}](https://i3wm.org/downloads/) for RHEL8/9 (built on AlmaLinux 8), with bundled libraries.'

name: Build git

on:
  push:
    branches: ['**']
    paths:
      - 'packages/git/**'
      - 'build.sh'
      - '.github/workflows/git.yml'
    tags:
      - 'git-v*'
  pull_request:
    paths:
      - 'packages/git/**'
      - 'build.sh'
      - '.github/workflows/git.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rhel_version: [rhel8]  # add rhel9 if rhel8 build doesn't run on RHEL9

    steps:
      - uses: actions/checkout@v7

      - name: Build ${{ matrix.rhel_version }}
        run: ./build.sh git ${{ matrix.rhel_version }}

      - name: Test on AlmaLinux 8
        run: ./test.sh git rhel8

      - name: Test on AlmaLinux 9 (rhel8 binary, glibc forwards-compat)
        run: ./test.sh git rhel9

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: git-${{ matrix.rhel_version }}
          path: output/git/${{ matrix.rhel_version }}/
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/git-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: false

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./scripts/release.sh git
          'Binary builds of [git v{version}](https://github.com/git/git/releases/tag/v{version}) for RHEL8/9 (built on AlmaLinux 8).'

name: Build nvim

on:
  push:
    branches: ['**']
    paths:
      - 'packages/nvim/**'
      - 'build.sh'
      - '.github/workflows/nvim.yml'
    tags:
      - 'nvim-v*'
  pull_request:
    paths:
      - 'packages/nvim/**'
      - 'build.sh'
      - '.github/workflows/nvim.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rhel_version: [rhel8]  # add rhel9 if rhel8 build doesn't run on RHEL9

    steps:
      - uses: actions/checkout@v7

      - name: Build ${{ matrix.rhel_version }}
        run: ./build.sh nvim ${{ matrix.rhel_version }}

      - name: Test on AlmaLinux 8
        run: ./test.sh nvim rhel8

      - name: Test on AlmaLinux 9 (rhel8 binary, glibc forwards-compat)
        run: ./test.sh nvim rhel9

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nvim-${{ matrix.rhel_version }}
          path: output/nvim/${{ matrix.rhel_version }}/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/nvim-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: false

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#nvim-v}"

          FILES=$(find artifacts/ -type f \( -name "*.tar.gz" -o -name "*.sha256" \))

          gh release create "${TAG}" \
            --title "nvim v${VERSION}" \
            --notes "Binary builds of [nvim v${VERSION}](https://github.com/neovim/neovim/releases/tag/v${VERSION}) for RHEL8/9 (built on AlmaLinux 8)." \
            ${FILES}

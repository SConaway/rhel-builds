name: Build alacritty

on:
  push:
    paths:
      - 'packages/alacritty/**'
      - 'build.sh'
      - '.github/workflows/alacritty.yml'
    tags:
      - 'alacritty-v*'
  pull_request:
    paths:
      - 'packages/alacritty/**'
      - 'build.sh'
      - '.github/workflows/alacritty.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rhel_version: [rhel8]  # add rhel9 if rhel8 build doesn't run on RHEL9

    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.rhel_version }}
        run: ./build.sh alacritty ${{ matrix.rhel_version }}

      - name: Test on AlmaLinux 8
        run: ./test.sh alacritty rhel8

      - name: Test on AlmaLinux 9 (rhel8 binary, glibc forwards-compat)
        run: ./test.sh alacritty rhel9

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alacritty-${{ matrix.rhel_version }}
          path: output/alacritty/${{ matrix.rhel_version }}/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/alacritty-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: false

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#alacritty-v}"

          gh release create "${TAG}" \
            --title "alacritty v${VERSION}" \
            --notes "Binary builds of [alacritty v${VERSION}](https://github.com/alacritty/alacritty/releases/tag/v${VERSION}) for RHEL8/9 (built on AlmaLinux 8)." \
            artifacts/**/*.tar.gz \
            artifacts/**/*.sha256

name: Build opencode-v2

on:
  push:
    branches: ['**']
    paths:
      - 'packages/opencode-v2/**'
      - 'build.sh'
      - '.github/workflows/opencode-v2.yml'
    tags:
      - 'opencode-v2-v*'
  pull_request:
    paths:
      - 'packages/opencode-v2/**'
      - 'build.sh'
      - '.github/workflows/opencode-v2.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rhel_version: [rhel8]  # add rhel9 if rhel8 build doesn't run on RHEL9

    steps:
      - uses: actions/checkout@v7

      - name: Build ${{ matrix.rhel_version }}
        run: ./build.sh opencode-v2 ${{ matrix.rhel_version }}

      - name: Test on AlmaLinux 8
        run: ./test.sh opencode-v2 rhel8

      - name: Test on AlmaLinux 9 (rhel8 binary, glibc forwards-compat)
        run: ./test.sh opencode-v2 rhel9

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: opencode-v2-${{ matrix.rhel_version }}
          path: output/opencode-v2/${{ matrix.rhel_version }}/
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/opencode-v2-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: false

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./scripts/release.sh opencode-v2
          'Binary builds of [opencode-v2 v{version}](https://github.com/anomalyco/opencode/releases/tag/v{version}) for RHEL8/9 (built on AlmaLinux 8).'
